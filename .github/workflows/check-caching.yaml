name: Dependency Caching Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Dependencies
        id: my-cache
        uses: actions/cache@v4
        with:
          path: dummy-folder
          key: cache-a58abaf

      - name: prime-cache-a58abaf
        id: prime-cache-a58abaf
        run: |
          echo "Cache hit result: ${{ steps.my-cache.outputs.cache-hit }}"
          mkdir -p dummy-folder
          echo "saving this to cache" > dummy-folder/test.txt
